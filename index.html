        /* Background layer that transitions colors */
        :root[data-production-environment]:not([data-environment-ready]) .bg-light-shader { visibility: hidden; }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #091A12;
            transition: background-color 0.6s ease-in-out;
            z-index: 0;

        .bg-grain {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: var(--bg-grain-opacity);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)' opacity='.9'/%3E%3C/svg%3E");
            background-size: var(--bg-grain-size) var(--bg-grain-size);
            background-repeat: repeat;
            filter: contrast(var(--bg-grain-contrast));
            mix-blend-mode: var(--bg-grain-blend);
        }

        .bg-light-shader {
            position: absolute;
            inset: calc(-1 * var(--bg-light-softness));
            z-index: 2;
            pointer-events: none;
            opacity: var(--bg-light-opacity);
            filter: blur(var(--bg-light-softness));
            mix-blend-mode: var(--bg-light-blend);
            mask-image: radial-gradient(
                ellipse var(--bg-light-spread-x) var(--bg-light-spread-y) at var(--bg-light-x) var(--bg-light-y),

                rgba(0, 0, 0, 0.92) 36%,
                rgba(0, 0, 0, 0.42) 68%,
                transparent 100%
            );
            -webkit-mask-image: radial-gradient(
                ellipse var(--bg-light-spread-x) var(--bg-light-spread-y) at var(--bg-light-x) var(--bg-light-y),
                black 0%,
                rgba(0, 0, 0, 0.92) 36%,
                rgba(0, 0, 0, 0.42) 68%,
                transparent 100%
            );
            will-change: opacity, filter;
        }


        /* The scroll container */

        /* Video frame container - 9:16 aspect ratio (phone-like) */
        .video-frame {
            position: relative;
            width: min(calc(91vh * 9 / 16), 95vw);
            aspect-ratio: 9/16;
            border-radius: 8px;
            overflow: hidden;
            /* Responsive shadow */
            box-shadow: 0 clamp(15px, 3vh, 25px) clamp(40px, 8vh, 80px) rgba(0, 0, 0, 0.4);
            opacity: 0.2;
            transform: scale(0.9);
            /* Smooth transition for scroll animations */
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }

        /* Vertical Navigation Arrows - FIXED position right of video frame */
        .video-nav-arrows {
            position: fixed;
            /* Position just to the right of video frame */
            left: calc(50% + min(calc(91vh * 9 / 16), 95vw) / 2 + 24px);
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;

            z-index: 1000;
            transition: left 0.3s ease;
        }

        /* Adjust arrow position for landscape videos */
        .video-nav-arrows.landscape {
            left: calc(50% + min(calc(91vh * 16 / 9), calc(100vw - 152px)) / 2 + 24px);

        .nav-arrow-btn.like-btn {
            width: 48px;

        .nav-arrow-btn.like-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: white;
            stroke-width: 1.5;
            flex-shrink: 0;
            /* Ensure icon stays centered */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        /* When expanded (has class expand or via JS height change), move icon up */
        .nav-arrow-btn.like-btn.has-likes svg {
            top: 12px;
            /* Fixed position from top */
            transform: translate(-50%, 0);
        }

        /* Make the entire like button fully opaque when liked, overriding default button opacity */
        .nav-arrow-btn.like-btn.liked {
            opacity: 1;
            background:
                radial-gradient(ellipse at 72% 12%, rgba(255, 224, 183, 0.14), transparent 58%),
                linear-gradient(180deg, #3e2832 0%, #241720 100%);
        }

        .nav-arrow-btn.like-btn.liked svg path {
            clip-path: url(#heartClip);
        }

        .nav-arrow-btn.like-btn.liked svg {
            fill: url(#heartGradient);
            stroke: url(#strokeGradient);
            /* Draws the fill first, then the stroke on top. This makes it an "inside" border. */
            paint-order: fill stroke;
            /* width of 3px is used because the clip-path cuts off the outer 1.5px */
            stroke-width: 3;
        }

        .nav-arrow-btn.like-btn.pulse:not(.has-likes) svg {
            animation: heartPulseCenter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-arrow-btn.like-btn.pulse.has-likes svg {
            animation: heartPulseTop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes heartPulseCenter {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }

            40% {
                transform: translate(-50%, -50%) scale(1.35);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes heartPulseTop {
            0% {
                transform: translate(-50%, 0) scale(1);
            }

            40% {
                transform: translate(-50%, 0) scale(1.35);
            }

            100% {
                transform: translate(-50%, 0) scale(1);
            }
        }

        }


        .video-buffering {
            position: absolute;
            inset: 0;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0s linear 0.2s;
        }

        .video-frame.is-buffering .video-buffering,
        .landing-video-frame.is-buffering .video-buffering {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.2s ease, visibility 0s;
        }

        .video-buffering-ring {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(244, 239, 230, 0.22);
            border-top-color: rgba(244, 239, 230, 0.92);
            animation: videoBufferSpin 0.7s linear infinite;
        }

        @keyframes videoBufferSpin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .video-buffering-ring {
                animation: videoBufferPulse 1.2s ease-in-out infinite;
                border-color: rgba(244, 239, 230, 0.5);
            }

            @keyframes videoBufferPulse {
                0%, 100% { opacity: 0.35; }
                50% { opacity: 1; }
            }
        }

        /* R2 video play button overlay - matches control bar style */
        .video-frame .play-overlay-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            color: white;
            isolation: isolate;
        }

        /* Only show button when paused */
        .video-frame .play-overlay-btn.paused {
            opacity: 1;
            pointer-events: auto;
        }

        .video-frame .play-overlay-btn:hover {
            background: rgba(255, 255, 255, 0.42);
            transform: translate(-50%, -50%) scale(1.05);
        }

        .play-overlay-btn svg {
            width: 28px;
            height: 28px;
            margin-left: 3px;
        }

        .play-overlay-btn .play-with-sound-ring {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 124px;
            height: 124px;
            margin: 0;
            overflow: visible;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: rotatePlayWithSound 36s linear infinite;
            will-change: transform;
        }

        body.experience-awaiting-start .play-overlay-btn .play-with-sound-ring {
            display: block;
        }

        .play-overlay-btn::before {
            content: '';
            position: absolute;
            inset: calc(-1 * var(--play-halo-size));
            border-radius: 50%;
            background: radial-gradient(
                circle,
                color-mix(in srgb, var(--active-bg-color) 42%, rgb(0 0 0 / var(--play-halo-darkness))) 0%,
                rgb(5 14 10 / calc(var(--play-halo-darkness) * 0.5)) 46%,
                transparent 74%
            );
            filter: blur(var(--play-halo-blur));
            z-index: -1;
            pointer-events: none;
        }

        body.experience-awaiting-start .video-frame .play-overlay-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .play-with-sound-ring text {
            fill: rgba(255, 255, 255, 0.92);
            font-family: 'Inter', sans-serif;
            font-size: 8.5px;
            font-weight: 500;
            letter-spacing: 2.4px;
            text-transform: uppercase;
        }

        @keyframes rotatePlayWithSound {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .play-overlay-btn .play-with-sound-ring {
                animation: none;
            }
        }

        /* ========== VIDEO SEEKBAR ========== */
        .video-seekbar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: auto;
            height: 18px;
            /* Hit area */
            z-index: 110;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            padding: 0 0 0 0;
            transition: padding 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .video-seekbar:hover,
        .video-seekbar.dragging {
            padding: 0 16px 16px 16px;
        }

        .video-seekbar-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            position: relative;
            border-radius: 0;
            transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                border-radius 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .video-seekbar:hover .video-seekbar-track,
        .video-seekbar.dragging .video-seekbar-track {
            height: 5px;
            border-radius: 20px;
        }

        .video-seekbar-fill {
            height: 100%;
            width: 0%;
            background: rgba(255, 255, 255, 0.85);
            position: relative;
            border-radius: 0;
            transition: border-radius 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .video-seekbar:hover .video-seekbar-fill,
        .video-seekbar.dragging .video-seekbar-fill {
            border-radius: 20px 0 0 20px;
        }

        /* Thumb circle - hidden by default, appears on hover/drag */
        .video-seekbar-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.3), 0 0 12px rgba(255, 255, 255, 0.15);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .video-seekbar:hover .video-seekbar-fill::after,
        .video-seekbar.dragging .video-seekbar-fill::after {
            transform: translateY(-50%) scale(1);
        }

        /* Buffer / background track subtle styling */
        .video-seekbar-track::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        /* Hide seekbar on landscape video frames — use same bar */
        .video-section.landscape-mode .video-seekbar {
            border-radius: 0 0 12px 12px;
        }

        .video-section.landscape-mode .video-seekbar-track {
            border-radius: 0 0 12px 12px;
        }


        /* Info bars on the sides - responsive positioning */
        .info-bar {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.5vw, 12px);
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.5s ease-in-out 0.15s, transform 0.5s ease-in-out 0.15s;
        }

        .info-bar.right {
            right: calc(50% - min(420px, 35vw));
            top: 50%;
            transform: translateY(-50%) translateX(20px);
        }

        .video-section.active .info-bar {
            opacity: 1;
            transform: translateX(0);
        }

        .video-section.active .info-bar.right {
            transform: translateY(-50%) translateX(0);
        }

        .info-bar.left {
            left: calc(50% - min(420px, 35vw));
            top: 40%;
        }

        .info-line {
            height: clamp(8px, 1.2vw, 12px);
            background: rgba(255, 255, 255, 0.25);
            border-radius: clamp(4px, 0.6vw, 6px);
        }

        .info-line.short {
            width: clamp(40px, 6vw, 60px);
        }

        .info-line.medium {
            width: clamp(65px, 9vw, 100px);
        }

        .info-line.long {
            width: clamp(90px, 12vw, 140px);
        }

        .info-dot {
            width: clamp(20px, 2.5vw, 28px);
            height: clamp(20px, 2.5vw, 28px);
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .info-group {
            display: flex;
            align-items: center;
            gap: clamp(8px, 1.2vw, 12px);
        }

        /* NEW: Left Info Section (Title + Desc) */
        .content-info-left {
            position: absolute;
            left: calc(50% - min(650px, 48vw));
            top: 50%;
            transform: translateY(-50%) translateX(-50px);
            width: clamp(250px, 25vw, 350px);
            opacity: 0;
            transition: all 0.6s ease-out 0.2s;
            text-align: left;
            pointer-events: none;
            /* Let clicks pass through if needed */
            z-index: 10;
        }

        .video-section.active .content-info-left {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        /* Based on design: Description first, then Title */
        .content-desc {
            color: rgba(255, 255, 255, 0.8);
            font-size: clamp(12px, 1.2vw, 14px);
            line-height: 1.5;
            margin-bottom: clamp(12px, 2vh, 20px);
            font-weight: 400;
        }

        .content-title {
            color: rgb(255 255 255 / var(--project-title-important-opacity));
            font-size: min(var(--project-title-font-size), 8vw);
            font-weight: var(--project-title-font-weight);
            letter-spacing: var(--project-title-letter-spacing);
            line-height: var(--project-title-line-height);
        }

        .content-title-important {
            color: rgb(255 255 255 / var(--project-title-important-opacity));
        }

        .content-title-supporting {
            color: rgb(255 255 255 / var(--project-title-supporting-opacity));
        }

        /* Project Link Button */
        .content-link, .info-panel-link {
            --landing-light-x: 35%;
            --landing-light-y: 12%;
            --landing-light-strength: 0;
            --landing-glow: 232 186 130;
            position: relative;
            isolation: isolate;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background:
                linear-gradient(
                    180deg,
                    color-mix(in srgb, var(--active-bg-color) 36%, #3a322c) 0%,
                    color-mix(in srgb, var(--active-bg-color) 70%, #100c0a) 100%
                );
            border: 1px solid rgba(0, 0, 0, 0.28);
            padding: 14px 22px;
            border-radius: 999px;
            color: rgba(255, 255, 255, 0.86);
            font-size: clamp(14px, 1.5vw, 16px);
            font-weight: 500;
            text-decoration: none;
            margin-top: clamp(16px, 3vh, 24px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.17),
                inset 0 -5px 10px rgba(0, 0, 0, 0.2),
                0 3px 5px rgba(0, 0, 0, 0.2),
                0 10px 22px rgba(0, 0, 0, 0.28);
            transition:
                color 0.5s ease,
                box-shadow 0.5s ease;
            cursor: pointer;
            pointer-events: auto;
        }

        .content-link::before, .info-panel-link::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 35% 0%, rgba(255, 224, 183, 0.14), transparent 58%),
                linear-gradient(110deg, rgba(255, 255, 255, 0.035), transparent 42%);
        }

        .content-link::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: var(--landing-light-strength);
            background: radial-gradient(
                circle 5.6rem at var(--landing-light-x) var(--landing-light-y),
                rgb(var(--landing-glow) / 0.78) 0%,
                rgb(var(--landing-glow) / 0.28) 36%,
                transparent 72%
            );
            filter: blur(12px);
            mix-blend-mode: soft-light;
        }

        .content-link-inner {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .content-link:hover, .info-panel-link:hover {
            color: rgba(255, 255, 255, 0.96);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                inset 0 -5px 10px rgba(0, 0, 0, 0.18),
                0 4px 6px rgba(0, 0, 0, 0.2),
                0 14px 26px rgba(0, 0, 0, 0.32);
        }

        .content-link:active, .info-panel-link:active {
            transform: translateY(2px) scale(0.985);
            box-shadow:
                inset 0 3px 8px rgba(0, 0, 0, 0.32),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 3px 8px rgba(0, 0, 0, 0.2);
            transition-duration: 0.08s;
        }

        .content-link svg {
            width: 18px;
            height: 18px;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }

        .content-link:hover svg {
            opacity: 1;
        }

        /* NEW: Right Info Section (Comments) */
        .content-info-right {
            position: absolute;
            right: calc(50% - min(650px, 48vw));
            top: 40%;
            /* Positioned slightly higher to match design */
            transform: translateY(-50%) translateX(50px);
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transition: all 0.6s ease-out 0.4s;
            z-index: 10;
        }

        .video-section.active .content-info-right {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        .comment-pill {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(
                    180deg,
                    color-mix(in srgb, var(--active-bg-color) 78%, #080605) 0%,
                    color-mix(in srgb, var(--active-bg-color) 52%, #1a1410) 100%
                );
            border: 1px solid rgba(0, 0, 0, 0.28);
            padding: 12px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 280px;
            color: rgba(255, 255, 255, 0.78);
            font-size: 13px;
            box-shadow:
                inset 0 4px 8px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(0, 0, 0, 0.35),
                inset 0 -1px 0 rgba(255, 255, 255, 0.08);
            animation: subtleFloat 5s ease-in-out infinite;
        }

        .comment-pill::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 100%, rgba(255, 255, 255, 0.05), transparent 52%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.18), transparent 46%);
        }

        .comment-pill > * {
            position: relative;
            z-index: 1;
        }

        /* Stagger animation for multiple comments */
        .comment-pill:nth-child(2) {
            animation-delay: 1.5s;
            animation-duration: 6s;
        }

        .comment-pill:nth-child(3) {
            animation-delay: 3s;
            animation-duration: 5.5s;
        }

        .comment-pill:nth-child(4) {
            animation-delay: 0.5s;
            animation-duration: 6.5s;
        }

        @keyframes subtleFloat {

            0%,
            100% {
                transform: translateY(0) translateX(0) rotate(0deg);
            }

            25% {
                transform: translateY(-6px) translateX(3px) rotate(0.5deg);
            }

            50% {
                transform: translateY(-3px) translateX(-2px) rotate(-0.3deg);
            }

            75% {
                transform: translateY(-8px) translateX(1px) rotate(0.3deg);
            }
        }

        .comment-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
            box-shadow:
                inset 0 2px 4px rgba(0, 0, 0, 0.38),
                inset 0 -1px 0 rgba(255, 255, 255, 0.08);
        }

        /* Removed 1024px hiding rule to avoid dead zone before 768px mobile mode */

        .toggle-btn {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            padding: clamp(6px, 1vw, 8px) clamp(12px, 1.5vw, 16px);
            border-radius: clamp(18px, 2.5vw, 25px);
            gap: clamp(8px, 1.2vw, 12px);
        }

        .toggle-btn .line {
            width: clamp(35px, 5vw, 50px);
            height: clamp(6px, 0.8vw, 8px);
            background: rgba(255, 255, 255, 0.4);
            border-radius: clamp(3px, 0.4vw, 4px);
        }

        .toggle-btn .circle {
            width: clamp(18px, 2.2vw, 24px);
            height: clamp(18px, 2.2vw, 24px);
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }

        /* Control bar container - responsive positioning */
        .control-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            bottom: auto;
            left: auto;
            transform: none;
            display: flex;
            align-items: center;
            gap: 0;
            z-index: 1000;
            transition:
                opacity 0.3s ease,
                visibility 0s linear 0.3s,
                transform 0.3s ease;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-4px);
        }

        @media (min-width: 1025px) and (hover: hover) {
            body.video-hover-active:not(.experience-awaiting-start) .control-bar,
            .control-bar:hover,
            .control-bar:focus-within {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                transform: translateY(0);
                transition:
                    opacity 0.3s ease,
                    visibility 0s,
                    transform 0.3s ease;
            }
        }

        .control-bar.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Unmute button - responsive sizing */
        .unmute-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            font-size: clamp(12px, 2vw, 15px);
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .unmute-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .unmute-btn svg {
            width: 20px;
            height: 20px;
        }

        #soundBtnText {
            display: none;
        }

        /* Unmute button pulse animation - draws attention until user unmutes */
        .unmute-btn.pulsing {
            animation: unmutePulseOuter 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }

        /* Animate the icon gently */
        .unmute-btn.pulsing svg {
            animation: iconWiggle 2s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes iconWiggle {

            0%,
            100% {
                transform: rotate(0deg) scale(1);
            }

            10% {
                transform: rotate(-10deg) scale(1.1);
            }

            20% {
                transform: rotate(10deg) scale(1.1);
            }

            30% {
                transform: rotate(-10deg) scale(1.1);
            }

            40% {
                transform: rotate(10deg) scale(1.1);
            }

            50%,
            100% {
                transform: rotate(0deg) scale(1);
            }
        }

        @keyframes unmutePulseOuter {
            0% {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2), 0 0 0 0 rgba(255, 255, 255, 0.2);
            }

            100% {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2), 0 0 0 20px rgba(255, 255, 255, 0);
            }
        }

        /* Play/Stop button - responsive circular button */
        .play-stop-btn {
            width: clamp(36px, 7vw, 44px);
            height: clamp(36px, 7vw, 44px);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .play-stop-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .play-stop-btn svg {
            width: clamp(20px, 4vw, 24px);
            height: clamp(20px, 4vw, 24px);
        }

        /* Tab Navigation - sticky on landing, becomes fixed at top when scrolling */
        .tab-nav {
            position: sticky;
            top: clamp(12px, 3vh, 20px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: opacity 0.3s ease, visibility 0.3s ease;
            width: fit-content;
            margin: 0 auto 16px auto;
        }

        .navbar-wrapper {
            position: fixed;
            top: clamp(12px, 3vh, 20px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 11000;
            pointer-events: none;
            transition: top 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .navbar-wrapper>* {
            pointer-events: auto;
        }

        /* Logo Button - Separate circular VS initials button */
        .logo-btn {
            width: clamp(40px, 6vw, 50px);
            height: clamp(40px, 6vw, 50px);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            font-size: clamp(13px, 2vw, 16px);
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            transition: all 0.3s ease, opacity 0.3s ease, visibility 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .logo-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
            color: white;
        }

        .logo-btn.active {
            background: rgba(124, 58, 237, 0.6);
            border-color: rgba(124, 58, 237, 0.8);
            color: white;
        }

        /* Global tabs - fixed behavior handled by navbar-wrapper */
        .tab-nav.global-tabs {
            margin: 0;
            /* Snappier transition for opacity/visibility only */
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        @media (min-width: 601px) {
            .navbar-wrapper {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }

        /* Landing position state for the category navigation */
        .tab-nav.global-tabs.landing-position {
            /* Position handled by JS for perfect sync with scroll */
            pointer-events: auto;
            /* Placeholder to prevent empty ruleset */
        }

        .navbar-wrapper.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Single scroll container - no more tab transforms */
        .tabs-container {
            display: contents;
            /* Acts as a simple wrapper, content flows naturally */
        }




        @media (max-width: 1024px) {

            .info-bar {
                display: none;
            }
        }


        /* Main scroll container */
        .main-scroll-container {
            position: relative;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .main-scroll-container::-webkit-scrollbar {
            display: none;
        }

        /* Tabs world container - full page */
        .tabs-world {
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        /* ========== NEW LANDING SECTION STYLES ========== */

        /* Landing Section - Full screen video-like view */
        .landing-section {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: center;
            scroll-snap-stop: always;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: visible;
        }

        @media (prefers-reduced-motion: no-preference) {
            body.intro-pending .landing-video-shell,
            body.intro-pending .landing-bio,
            body.intro-pending .landing-name,
            body.intro-pending .landing-locations,
            body.intro-pending .landing-actions,
            body.intro-pending .video-nav-arrows {
                opacity: 0;
            }

            body.intro-pending .landing-video-shell {
                transform: translateY(18px) scale(0.984);
            }

            body.intro-pending .landing-bio,
            body.intro-pending .landing-name,
            body.intro-pending .landing-locations,
            body.intro-pending .landing-actions {
                transform: translateY(10px);
            }

            body.intro-pending .video-nav-arrows {
                transform: translateY(calc(-50% + 12px));
            }

            body.intro-ready .landing-video-shell,
            body.intro-ready .landing-bio,
            body.intro-ready .landing-name,
            body.intro-ready .landing-locations,
            body.intro-ready .landing-actions,
            body.intro-ready .video-nav-arrows {
                opacity: 1;
                transition:
                    opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
            }

            body.intro-ready .landing-video-shell {
                transform: none;
                transition-delay: 60ms;
            }

            body.intro-ready .landing-bio {
                transform: none;
                transition-delay: 180ms;
            }

            body.intro-ready .landing-name {
                transform: none;
                transition-delay: 260ms;
            }

            body.intro-ready .landing-locations {
                transform: none;
                transition-delay: 340ms;
            }

            body.intro-ready .landing-actions {
                transform: none;
                transition-delay: 420ms;
            }

            body.intro-ready .video-nav-arrows {
                transform: translateY(-50%);
                transition-delay: 500ms;
            }
        }

        /* Landing Profile Info - Left Side */
        .landing-profile-info {
            position: absolute;
            left: calc(50% - min(650px, 48vw));
            top: 50%;
            transform: translateY(-50%);
            width: clamp(250px, 25vw, 350px);
            max-width: none;
            z-index: 10;
            text-align: left;
        }

        .landing-bio {
            color: rgba(255, 255, 255, 0.75);
            font-size: clamp(13px, 1.3vw, 16px);
            line-height: 1.5;
            margin-bottom: clamp(12px, 2vh, 20px);
            font-weight: 400;
        }

        .landing-name {
            color: rgb(255 255 255 / var(--project-title-important-opacity));
            font-size: min(var(--project-title-font-size), 8vw);
            font-weight: var(--project-title-font-weight);
            letter-spacing: var(--project-title-letter-spacing);
            line-height: var(--project-title-line-height);
            margin: 0 0 clamp(12px, 2vh, 20px) 0;
        }

        .landing-locations {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .location-tag {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background:
                linear-gradient(
                    180deg,
                    color-mix(in srgb, var(--active-bg-color) 78%, #080605) 0%,
                    color-mix(in srgb, var(--active-bg-color) 52%, #1a1410) 100%
                );
            border: 1px solid rgba(0, 0, 0, 0.28);
            padding: 7px 10px;
            border-radius: 999px;
            color: rgba(255, 255, 255, 0.78);
            font-size: clamp(11px, 1vw, 13px);
            font-weight: 550;
            line-height: 1;
            letter-spacing: 0.01em;
            box-shadow:
                inset 0 4px 8px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(0, 0, 0, 0.35),
                inset 0 -1px 0 rgba(255, 255, 255, 0.08);
        }

        .location-tag::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 100%, rgba(255, 255, 255, 0.05), transparent 52%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.18), transparent 46%);
        }

        .location-tag svg {
            width: 13px;
            height: 13px;
            opacity: 0.72;
        }

        .landing-actions {
            display: flex;
            align-items: center;
            gap: var(--landing-actions-gap);
            margin-top: 14px;
        }

        .landing-action {
            --landing-light-x: 72%;
            --landing-light-y: 18%;
            --landing-light-strength: 0;
            --landing-glow: 255 196 140;
            height: var(--landing-action-height);
            position: relative;
            isolation: isolate;
            overflow: hidden;
            border: 0;
            background:
                linear-gradient(
                    180deg,
                    #322720 0%,
                    #211813 100%
                );
            background-clip: padding-box;
            color: rgba(255, 255, 255, 0.82);
            border-radius: 12px;
            clip-path: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.16),
                inset 0 -5px 10px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(0, 0, 0, 0.28),
                -10px 14px 22px rgba(0, 0, 0, 0.34),
                -4px 6px 10px rgba(0, 0, 0, 0.22);
            transition:
                color 0.5s ease,
                box-shadow 0.5s ease;
        }

        .landing-action::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 72% 12%, rgba(255, 224, 183, 0.16), transparent 58%),
                linear-gradient(110deg, rgba(255, 255, 255, 0.04), transparent 42%);
        }

        .landing-action::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: var(--landing-light-strength);
            background: radial-gradient(
                circle 5.6rem at var(--landing-light-x) var(--landing-light-y),
                rgb(var(--landing-glow) / 0.78) 0%,
                rgb(var(--landing-glow) / 0.28) 36%,
                transparent 72%
            );
            filter: blur(12px);
            mix-blend-mode: soft-light;
        }

        .landing-action > * {
            position: relative;
            z-index: 1;
        }

        .landing-action:hover {
            color: rgba(255, 255, 255, 0.94);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                inset 0 -5px 10px rgba(0, 0, 0, 0.18),
                0 0 0 1px rgba(0, 0, 0, 0.28),
                -11px 15px 24px rgba(0, 0, 0, 0.34),
                -4px 6px 10px rgba(0, 0, 0, 0.22);
        }

        .landing-action:active {
            background:
                radial-gradient(circle at 72% 18%, rgba(255, 224, 183, 0.06), transparent 50%),
                linear-gradient(
                    180deg,
                    color-mix(in srgb, var(--active-bg-color) 62%, #1c1814) 0%,
                    color-mix(in srgb, var(--active-bg-color) 88%, #030201) 100%
                );
            transform: translate(1px, 2px) scale(0.97);
            box-shadow:
                inset 0 3px 8px rgba(0, 0, 0, 0.32),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 0 1px rgba(0, 0, 0, 0.28),
                -3px 4px 8px rgba(0, 0, 0, 0.22);
            transition-duration: 0.08s;
        }

        .landing-action:active::before {
            opacity: 0.28;
        }

        .landing-action:active::after {
            opacity: 0;
        }

        .landing-action:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.9);
            outline-offset: 3px;
        }

        .landing-resume-action {
            --landing-glow: 118 196 148;
            --landing-light-x: 35%;
            --landing-light-y: 12%;
            flex: 0 0 auto;
            gap: var(--resume-icon-gap);
            padding: 0 var(--resume-padding-x);
            font-size: var(--resume-font-size);
            font-weight: var(--resume-font-weight);
            letter-spacing: var(--resume-letter-spacing);
            white-space: nowrap;
            border-radius: 999px;
            background:
                linear-gradient(
                    180deg,
                    color-mix(in srgb, var(--active-bg-color) 36%, #3a322c) 0%,
                    color-mix(in srgb, var(--active-bg-color) 70%, #100c0a) 100%
                );
            color: rgba(255, 255, 255, 0.86);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.17),
                inset 0 -5px 10px rgba(0, 0, 0, 0.2),
                0 3px 5px rgba(0, 0, 0, 0.2),
                0 10px 22px rgba(0, 0, 0, 0.28);
        }

        .landing-resume-action::before {
            background:
                radial-gradient(ellipse at 35% 0%, rgba(150, 220, 170, 0.16), transparent 58%),
                linear-gradient(110deg, rgba(180, 230, 190, 0.05), transparent 42%);
        }

        .landing-resume-action:hover {
            color: rgba(255, 255, 255, 0.96);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                inset 0 -5px 10px rgba(0, 0, 0, 0.18),
                0 4px 6px rgba(0, 0, 0, 0.2),
                0 14px 26px rgba(0, 0, 0, 0.32);
        }

        .landing-resume-action:active {
            background:
                radial-gradient(circle at 72% 18%, rgba(255, 224, 183, 0.06), transparent 50%),
                linear-gradient(
                    180deg,
                    color-mix(in srgb, var(--active-bg-color) 62%, #1c1814) 0%,
                    color-mix(in srgb, var(--active-bg-color) 88%, #030201) 100%
                );
        }

        .landing-social-action {
            width: var(--landing-action-height);
            flex: 0 0 var(--landing-action-height);
            border-radius: 50%;
        }

        .landing-linkedin-action {
            --landing-glow: 86 176 196;
            background: linear-gradient(180deg, var(--landing-linkedin-from) 0%, var(--landing-linkedin-to) 100%);
            color: #bfd0d5;
        }

        .landing-linkedin-action:hover {
            color: #d7e6ea;
        }

        .landing-x-action {
            --landing-glow: 232 196 148;
            background: linear-gradient(180deg, var(--landing-x-from) 0%, var(--landing-x-to) 100%);
            color: #d8cfc5;
        }

        .landing-x-action:hover {
            color: #efe8de;
        }

        .landing-email-action {
            --landing-glow: 214 138 118;
            background: linear-gradient(180deg, var(--landing-email-from) 0%, var(--landing-email-to) 100%);
            color: #d8bdb2;
        }

        .landing-email-action:hover {
            color: #ead4cc;
        }

        .landing-action svg {
            width: 19px;
            height: 19px;
        }

        .landing-action.is-placeholder {
            opacity: 0.86;
        }

        .landing-resume-action.is-placeholder {
            opacity: 1;
        }

        /* Landing Video Frame - Center */
        .landing-video-shell {
            position: relative;
            z-index: 5;
            border-radius: 8px;
            box-shadow: 0 clamp(15px, 3vh, 25px) clamp(40px, 8vh, 80px) rgba(0, 0, 0, 0.5);
        }

        .landing-video-frame {
            position: relative;
            width: min(calc(91vh * 9 / 16), 95vw);
            aspect-ratio: 9/16;
            border-radius: 8px;
            overflow: hidden;
            /* Skeleton placeholder background */
            background: linear-gradient(110deg,
                    rgba(255, 255, 255, 0.1) 0%,
                    rgba(255, 255, 255, 0.2) 50%,
                    rgba(255, 255, 255, 0.1) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .landing-video-frame.loaded {
            animation: none;
            background: none;
        }

        .landing-video-frame video,
        .landing-video-frame img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }



        /* Landing video frame play overlay - same as video-frame */
        .landing-video-frame {
            cursor: pointer;
        }

        .landing-video-frame .play-overlay-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            opacity: 1;
            pointer-events: auto;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            color: white;
            isolation: isolate;
        }

        /* Hide button when playing */
        .landing-video-frame .play-overlay-btn.playing {
            opacity: 0;
            pointer-events: none;
        }

        .landing-video-frame .play-overlay-btn:hover {
            background: rgba(255, 255, 255, 0.42);
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* Shared tactile play control — same lighting as nav/fullscreen buttons */
        .video-frame .play-overlay-btn,
        .landing-video-frame .play-overlay-btn {
            width: 56px;
            height: 56px;
            border: 0;
            color: #f4efe6;
            background:
                radial-gradient(circle at 72% 18%, rgba(255, 224, 183, 0.28), transparent 54%),
                linear-gradient(180deg, #e4ddd0 0%, #6f675c 100%);
            background-clip: padding-box;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.42),
                inset 0 -5px 10px rgba(0, 0, 0, 0.22),
                0 0 0 1px rgba(0, 0, 0, 0.28),
                -10px 14px 22px rgba(0, 0, 0, 0.34),
                -4px 6px 10px rgba(0, 0, 0, 0.22);
            transition:
                opacity 0.3s ease,
                background 0.22s ease,
                box-shadow 0.22s ease;
        }

        .video-frame .play-overlay-btn:hover,
        .landing-video-frame .play-overlay-btn:hover {
            background:
                radial-gradient(circle at 72% 18%, rgba(255, 224, 183, 0.34), transparent 56%),
                linear-gradient(180deg, #eee8db 0%, #7a7266 100%);
            transform: translate(-50%, -50%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                inset 0 -5px 10px rgba(0, 0, 0, 0.18),
                0 0 0 1px rgba(0, 0, 0, 0.28),
                -12px 16px 26px rgba(0, 0, 0, 0.36),
                -5px 8px 12px rgba(0, 0, 0, 0.24);
        }

        .video-frame .play-overlay-btn:active,
        .landing-video-frame .play-overlay-btn:active {
            background:
                radial-gradient(circle at 72% 18%, rgba(255, 224, 183, 0.1), transparent 50%),
                linear-gradient(180deg, #b8b0a2 0%, #4d473e 100%);
            transform: translate(-50%, -50%);
            box-shadow:
                inset 0 3px 8px rgba(0, 0, 0, 0.32),
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 0 0 1px rgba(0, 0, 0, 0.28),
                -3px 4px 8px rgba(0, 0, 0, 0.22);
            transition-duration: 0.08s;
        }

        .play-overlay-btn > svg:not(.play-with-sound-ring) {
            width: 22px;
            height: 22px;
            margin-left: 1px;
            color: #f4efe6;
            filter: none;
        }

        .play-overlay-btn .pause-overlay-icon {
            display: none;
            width: 26px;
            height: 26px;
            margin-left: 0;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* Mobile Bottom Navigation — hidden by default, shown at <=600px */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            box-sizing: content-box;
            height: 56px;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: none;
            z-index: 11000;
            justify-content: space-around;
            align-items: center;
        }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.45);
            font-family: inherit;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 12px;
            transition: color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-nav-item svg {
            width: 24px;
            height: 24px;
        }

        .mobile-nav-item.active {
            color: white;
        }

        .mobile-nav-item:active {
            transform: scale(0.92);
        }

        /* Desktop portrait stage: reserve real columns instead of fixed offsets.
           The gutter also leaves room for the 48px playback-control rail. */
        @media (min-width: 1025px) {
            :root {
                --reel-side-width: clamp(220px, 22vw, 380px);
                --reel-side-gap: clamp(100px, 6vw, 240px);
                --reel-comment-gap: calc(var(--reel-side-gap) + clamp(24px, 2vw, 64px));
                --reel-edge-space: clamp(24px, 3vw, 80px);
                --desktop-reel-width: min(
                    calc(91vh * 9 / 16),
                    calc(100vw - 2 * var(--reel-edge-space) - 2 * var(--reel-side-width) - 2 * var(--reel-comment-gap))
                );
                --landscape-edge-space: clamp(28px, 2.5vw, 48px);
                --landscape-control-gap: clamp(20px, 2vw, 32px);
                --landscape-control-width: 48px;
                --desktop-landscape-width: min(
                    calc(91vh * 16 / 9),
                    calc(100vw - 2 * var(--landscape-edge-space) - 2 * var(--landscape-control-gap) - 2 * var(--landscape-control-width))
                );
            }

            /* Reserve symmetric gutters so the video stays centred and its
               controls have real breathing room outside the frame. */
            body:not(.desktop-fullscreen-mode) .video-section.landscape-mode .video-frame {
                width: var(--desktop-landscape-width);
            }

            body:not(.desktop-fullscreen-mode) .video-nav-arrows.landscape {
                left: calc(50% + var(--desktop-landscape-width) / 2 + var(--landscape-control-gap));
                width: var(--landscape-control-width);
            }

            body.landscape-video-active:not(.desktop-fullscreen-mode) .control-bar {
                top: var(--landscape-edge-space);
                right: var(--landscape-edge-space);
            }

            body:not(.desktop-fullscreen-mode) .video-section:not(.landscape-mode) .video-frame {
                width: var(--desktop-reel-width);
            }

            .video-section:not(.landscape-mode) .content-info-left {
                left: auto;
                right: calc(50% + var(--desktop-reel-width) / 2 + var(--reel-side-gap));
                width: var(--reel-side-width);
            }

            .video-section:not(.landscape-mode) .content-info-right {
                right: auto;
                left: calc(50% + var(--desktop-reel-width) / 2 + var(--reel-comment-gap));
                width: var(--reel-side-width);
                gap: clamp(16px, 2vh, 28px);
            }

            .video-section:not(.landscape-mode) .content-title {
                font-size: min(var(--project-title-font-size), clamp(30px, 3.1vw, 48px));
                overflow-wrap: break-word;
            }

            .video-section:not(.landscape-mode) .comment-pill {
                max-width: 320px;
                font-size: clamp(13px, 0.8vw, 15px);
                line-height: 1.45;
            }

            body:not(.desktop-fullscreen-mode):has(.video-section.active:not(.landscape-mode)) .video-nav-arrows:not(.landscape) {
                left: calc(50% + var(--desktop-reel-width) / 2 + 24px);
            }
        }

        /* ===== TABLET: 601px–1024px ===== */
        @media (max-width: 1024px) {

            .video-container,
            .landing-section,
            .main-scroll-container,
            .tabs-world {
                height: 100vh !important;
                height: 100dvh !important;
            }

            .video-section {
                height: 100vh !important;
                height: 100dvh !important;
                overflow: hidden;
            }

            /* Content overlay: bottom of the video frame area */
            .content-info-left {
                position: absolute !important;
                left: 50% !important;
                bottom: 12% !important;
                top: auto !important;
                right: auto !important;
                transform: translateX(-50%) !important;
                width: auto !important;
                max-width: min(calc(min(calc(91vh * 9 / 16), 95vw) - 32px), 80vw) !important;
                z-index: 200 !important;
                opacity: 0 !important;
                visibility: hidden !important;
                text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8) !important;
                pointer-events: auto !important;
                transition: opacity 0.3s ease !important;
                text-align: left !important;
            }

            .video-section.active .content-info-left {
                opacity: 1 !important;
                visibility: visible !important;
            }

            /* Action buttons: vertical stack on the right */
            .video-nav-arrows {
                display: flex !important;
                position: fixed !important;

    <script>
        // State
        let videosData = null;
        let isMuted = true;
        let userManuallyMuted = false; // True when user explicitly clicked mute button
        let isWarping = false; // Flag to prevent BG updates during warp
        let isPlaying = false;
        let hasStartedExperience = false;
        let observer = null;
        let currentVideoId = null;
        let isScrolling = false;
        let userPaused = {}; // Track which videos were paused by the user
        let totalSectionsCount = 0; // Total sections for nav arrow visibility
        let playVideoDebounceTimer = null; // Debounce video playback during scroll
        let suppressObserverPlayback = false;


        function getSectionHeight() {
            if (window.innerWidth <= 600) {
                const nav = document.querySelector('.mobile-bottom-nav');
                const navStyle = nav ? getComputedStyle(nav) : null;
                const navIsVisible = navStyle && navStyle.display !== 'none' && navStyle.visibility !== 'hidden';
                const navH = navIsVisible ? nav.offsetHeight : 0;
                return window.innerHeight - navH;
            }
            return window.innerHeight;
        }

        // DOM Elements
        const bgLayer = document.getElementById('bgLayer');
        const tabsContainer = document.getElementById('tabsContainer');
        const globalTabs = document.getElementById('globalTabs');
        const controlBar = document.querySelector('.control-bar');

        function setBackgroundColor(color) {
            if (!color || !bgLayer) return;
            bgLayer.style.backgroundColor = color;
            document.documentElement.style.setProperty('--active-bg-color', color);
        }

        // --- First-party analytics (session + events, no third-party cookies) ---
        const _analyticsWorkerUrl = 'https://reelsfolio-likes.vibhoresinghal.workers.dev';
        const _watchState = {
            videoId: null,
            lastTick: 0,
            accumulated: 0,
            interval: null,
            viewed: new Set(),
        };

        function getAnalyticsSessionId() {
            try {
                let id = sessionStorage.getItem('rf_sid');
                if (!id) {
                    id = (crypto.randomUUID && crypto.randomUUID())
                        || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
                    sessionStorage.setItem('rf_sid', id);
                }
                return id;
            } catch (_) {
                return `tmp-${Date.now()}`;
            }
        }

        function getAnalyticsVisitorId() {
            try {
                let id = localStorage.getItem('rf_vid');
                if (!id) {
                    id = (crypto.randomUUID && crypto.randomUUID())
                        || `v-${Date.now()}-${Math.random().toString(16).slice(2)}`;
                    localStorage.setItem('rf_vid', id);
                }
                return id;
            } catch (_) {
                return getAnalyticsSessionId();
            }
        }

        function collectSessionSnapshot() {
            const ua = navigator.userAgent || '';
            const nav = performance.getEntriesByType
                ? performance.getEntriesByType('navigation')[0]
                : null;
            const paints = performance.getEntriesByType
                ? performance.getEntriesByType('paint')
                : [];
            const fcp = paints.find(entry => entry.name === 'first-contentful-paint');
            return {
                viewport: `${window.innerWidth}x${window.innerHeight}`,
                connection: (navigator.connection && navigator.connection.effectiveType) || '',
                language: navigator.language || '',
                timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone) || '',
                reducedMotion: !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches),
                ttfbMs: nav ? Math.round(nav.responseStart) : null,
                fcpMs: fcp ? Math.round(fcp.startTime) : null,
                loadMs: nav && nav.loadEventEnd ? Math.round(nav.loadEventEnd) : null,
                referrer: document.referrer || '',
                landingPath: location.origin + location.pathname + location.search,
                uaHint: /iPad|Tablet/i.test(ua) ? 'tablet' : /Mobi|iPhone|Android/i.test(ua) ? 'phone' : 'desktop',
            };
        }

        function trackEvent(action, data) {
            const event = {
                sessionId: getAnalyticsSessionId(),
                visitorId: getAnalyticsVisitorId(),
                action,
                ts: Date.now(),
                ...(data || {}),
            };
            setTimeout(() => {
                try {
                    navigator.sendBeacon(_analyticsWorkerUrl + '/events', JSON.stringify(event));
                } catch (_) { /* worker may still be deploying */ }
            }, 0);
        }

        function flushWatch() {
            if (!_watchState.videoId || _watchState.accumulated < 1) {
                _watchState.accumulated = 0;
                return;
            }
            trackEvent('video_heartbeat', {
                videoId: _watchState.videoId,
                seconds: Math.round(_watchState.accumulated),
                playing: isPlaying,
                muted: isMuted,
            });
            _watchState.accumulated = 0;
        }

        function startWatchTimer(videoId) {
            if (_watchState.videoId && _watchState.videoId !== videoId) {
                const now = Date.now();
                const current = document.getElementById(_watchState.videoId);
                if (current && !current.paused && document.visibilityState === 'visible') {
                    _watchState.accumulated += (now - _watchState.lastTick) / 1000;
                }
                flushWatch();
            }

            _watchState.videoId = videoId;
            _watchState.lastTick = Date.now();

            if (!_watchState.viewed.has(videoId)) {
                _watchState.viewed.add(videoId);
                const lookupId = videoId === 'landing-video' ? 'landing' : videoId;
                const section = document.querySelector(`[data-video-id="${lookupId}"]`)
                    || document.querySelector(`[data-video-id="${videoId}"]`);
                trackEvent('video_view', {
                    videoId,
                    category: section ? (section.getAttribute('data-category') || 'landing') : 'landing',
                });
            }

            const video = document.getElementById(videoId);
            if (video && !video._rfWatchEnd) {
                video.addEventListener('ended', () => {
                    if (_watchState.videoId !== videoId) return;
                    const now = Date.now();
                    if (document.visibilityState === 'visible') {
                        _watchState.accumulated += (now - _watchState.lastTick) / 1000;
                    }
                    flushWatch();
                    _watchState.lastTick = Date.now();
                });
                video._rfWatchEnd = true;
            }

            if (_watchState.interval) clearInterval(_watchState.interval);
            _watchState.interval = setInterval(() => {
                if (document.visibilityState !== 'visible' || !_watchState.videoId) return;
                const active = document.getElementById(_watchState.videoId);
                if (!active || active.paused) {
                    _watchState.lastTick = Date.now();
                    return;
                }
                const now = Date.now();
                _watchState.accumulated += (now - _watchState.lastTick) / 1000;
                _watchState.lastTick = now;
            }, 1000);
        }

        function cancelWatchTimer(videoId) {
            if (_watchState.videoId !== videoId) return;
            const now = Date.now();
            const video = document.getElementById(videoId);
            if (video && !video.paused && document.visibilityState === 'visible') {
                _watchState.accumulated += (now - _watchState.lastTick) / 1000;
            }
            flushWatch();
            _watchState.videoId = null;
            if (_watchState.interval) {
                clearInterval(_watchState.interval);
                _watchState.interval = null;
            }
        }

        function startAnalyticsSession() {
            try {
                if (sessionStorage.getItem('rf_session_started')) return;
            } catch (_) { /* continue */ }
            const send = () => {
                try { sessionStorage.setItem('rf_session_started', '1'); } catch (_) { /* ignore */ }
                trackEvent('session_start', { session: collectSessionSnapshot() });
            };
            if (document.readyState === 'complete') send();
            else window.addEventListener('load', () => setTimeout(send, 0), { once: true });
        }

        document.addEventListener('click', event => {
            const link = event.target.closest('.landing-action, .content-link');
            if (!link || link.classList.contains('is-placeholder')) return;
            const href = link.getAttribute('href') || '';

        // this rewrites the old public host to the custom domain.
        // New images should use https://img.vibhoresinghal.com/... directly.
        const R2_MEDIA_ORIGINS = {
            'pub-a6a75e45309c4da7bb1fb6c3aea78409.r2.dev': 'video.vibhoresinghal.com',
        };

        function rewriteMediaUrl(value) {
            if (typeof value !== 'string' || !value.includes('.r2.dev')) return value;
            try {
                const url = new URL(value);
                const nextHost = R2_MEDIA_ORIGINS[url.host];
                if (!nextHost) return value;
                url.protocol = 'https:';
                url.host = nextHost.replace(/^https?:\/\//, '').replace(/\/$/, '');
                return url.toString();
            } catch {
                return value;
            }
        }

        function rewriteMediaTree(node) {
            if (Array.isArray(node)) return node.map(rewriteMediaTree);
            if (node && typeof node === 'object') {
                for (const key of Object.keys(node)) node[key] = rewriteMediaTree(node[key]);
                return node;
            }
            return rewriteMediaUrl(node);
        }

        function applyMediaOriginPreconnects() {
            document.querySelectorAll('link[rel="preconnect"]').forEach((link) => {
                const next = rewriteMediaUrl(link.getAttribute('href') || '');
                if (next) link.setAttribute('href', next);
            });
        }

                renderApp();

                initSoundHint(); // Show 'Tap for sound' hint on first visit
                initMobileFirstReelNudge();

                initBufferingIndicators();
                const initialVideos = [...document.querySelectorAll('.video-section video, .landing-section video')];
                const container = document.getElementById('mainScrollContainer');
                let revealScheduled = false;
                const revealInitialMedia = () => {
                    const activeId = getCurrentVideoId();
                    const video = document.getElementById(activeId === 'landing' ? 'landing-video' : activeId);
                    if (revealScheduled || !video || video.readyState < 2 || video.seeking) return;
                    revealScheduled = true;
                    requestAnimationFrame(() => {
                        revealScheduled = false;
                        const nextId = getCurrentVideoId();
                        if ((nextId === 'landing' ? 'landing-video' : nextId) !== video.id || video.readyState < 2 || video.seeking) return;
                        initialVideos.forEach(item => {
                            item.removeEventListener('loadeddata', revealInitialMedia);
                            item.removeEventListener('seeked', revealInitialMedia);
                        });
                        container?.removeEventListener('scroll', revealInitialMedia);
                        document.body.classList.remove('initial-media-pending', 'intro-pending');
                        if (!reduceMotion) {
                            document.body.classList.add('intro-ready');
                            window.setTimeout(() => document.body.classList.remove('intro-ready'), 1600);
                        }
                    });
                };
                initialVideos.forEach(video => {
                    video.addEventListener('loadeddata', revealInitialMedia);
                    video.addEventListener('seeked', revealInitialMedia);
                });
                container?.addEventListener('scroll', revealInitialMedia, { passive: true });
                revealInitialMedia();
            } catch (error) {
                console.error('Failed to load videos:', error);
                document.body.classList.remove('intro-pending');
            }
        }

                clearTimeout(hideTimer);

            frames.forEach(frame => {

                                </div>

                                        <svg class="play-with-sound-ring" viewBox="0 0 120 120" aria-hidden="true">
                                            <defs><path id="play-sound-path-${video.id}" d="M60,60 m-47,0 a47,47 0 1,1 94,0 a47,47 0 1,1 -94,0" /></defs>
